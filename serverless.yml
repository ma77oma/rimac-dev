service: rimac-appointments
frameworkVersion: "3"
configValidationMode: off

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: dev
  profile: rimac-dev
  memorySize: 256
  timeout: 20
  environment:
    TABLE_NAME: ${self:service}-appointments-${self:provider.stage}
    TOPIC_ARN: { Ref: AppointmentsTopic }
    EVENT_BUS_NAME: ${self:service}-bus-${self:provider.stage}
    MYSQL_SECRET_ARN: arn:aws:secretsmanager:us-east-1:935244547013:secret:rimac/dev/mysql-1oiqkn
    MYSQL_DB: appointments
  iam:
    role:
      statements:
        # DynamoDB
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
            - dynamodb:GetItem
          Resource:
            - { "Fn::GetAtt": [AppointmentsTable, Arn] }
            - {
                "Fn::Join":
                  [
                    "",
                    [{ "Fn::GetAtt": [AppointmentsTable, Arn] }, "/index/*"],
                  ],
              }

        # SNS publish
        - Effect: Allow
          Action: [sns:Publish]
          Resource: { Ref: AppointmentsTopic }

        # SQS client permissions
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - { "Fn::GetAtt": [QueuePE, Arn] }
            - { "Fn::GetAtt": [QueueCL, Arn] }
            - { "Fn::GetAtt": [QueueConfirmed, Arn] }

        # EventBridge
        - Effect: Allow
          Action: [events:PutEvents]
          Resource: "*"

        # Secrets Manager
        - Effect: Allow
          Action: [secretsmanager:GetSecretValue]
          Resource: ${self:provider.environment.MYSQL_SECRET_ARN}

        # Lambda en VPC: manejo de ENIs
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: "*"

plugins:
  - serverless-openapi-documentation
  - serverless-esbuild
  - serverless-offline
  - serverless-dotenv-plugin

package:
  individually: true

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    format: cjs
    external: [aws-sdk] # Excluir SDK v2. Los @aws-sdk/* (v3) se empaquetan.
  dotenv:
    path: .env.${opt:stage, 'local'}
    include:
      - NODE_ENV
      - APP_REGION
      - USE_IN_MEMORY
  documentation:
    api:
      info:
        title: Rimac Appointments API
        version: "1.0.0"
        description: API para el flujo de agendamiento (Lambdas + SNS/SQS/Dynamo/MySQL/EventBridge)
    components:
      schemas:
        NewAppointment:
          type: object
          required:
            - insuredId
            - scheduleId
            - countryISO
          properties:
            insuredId:
              type: string
              example: "00045"
              description: "Identificador del asegurado (5 dígitos)"
            scheduleId:
              type: integer
              example: 123
            countryISO:
              type: string
              example: "PE"
        Appointment:
          type: object
          properties:
            appointmentId:
              type: string
            insuredId:
              type: string
            scheduleId:
              type: integer
            countryISO:
              type: string
            status:
              type: string
              example: pending
            createdAt:
              type: string
              format: date-time
        AppointmentCreatedResponse:
          type: object
          properties:
            appointmentId:
              type: string
            message:
              type: string
    # opcional: tags globales
    tags:
      - name: Appointments
        description: Endpoints para manejo de citas
functions:
  appointmentApi:
    handler: src/lambdas/appointment_api.handler
    # Sin VPC: solo usa DynamoDB y SNS (servicios públicos)
    events:
      - http: # <-- usar "http" (REST) en vez de "httpApi"
          method: post
          path: /appointments
          cors: true
          
          documentation:
            summary: Crear una cita (se guarda en pending y publica evento)
            description: Recibe insuredId, scheduleId y countryISO. Guarda en Dynamo y publica evento.
            tags:
              - Appointments
            requestBody:
              description: Nuevo appointment
              required: true
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/NewAppointment"
            responses:
              - statusCode: 201
                description: Creado
                content: # <-- Usar 'content' en lugar de 'bodyType'
                  application/json:
                    schema:
                      $ref: "#/components/schemas/AppointmentCreatedResponse"
              - statusCode: 400
                description: Petición inválida
              - statusCode: 500
                description: Error interno

      - http:
          method: get
          path: /appointments/{insuredId}
          cors: true
          documentation:
            summary: Listar citas por insuredId
            tags:
              - Appointments
            parameters:
              - name: insuredId
                in: path
                required: true
                description: Identificador del asegurado (5 dígitos)
                schema:
                  type: string

  appointmentConfirm:
    handler: src/lambdas/appointment_confirm.handler
    # Sin VPC: solo usa DynamoDB (servicio público), puede acceder a SQS sin VPC Endpoint
    events:
      - sqs:
          arn: { "Fn::GetAtt": [QueueConfirmed, Arn] }

  appointmentPE:
    handler: src/lambdas/appointment_pe.handler
    # EN VPC: necesita acceder a MySQL que está en VPC
    vpc:
      securityGroupIds:
        - { Ref: LambdaSecurityGroup }
      subnetIds:
        - subnet-0ad08093fa9607012 # us-east-1a
        - subnet-013a8a1adbe3f2b89 # us-east-1f
    events:
      - sqs:
          arn: { "Fn::GetAtt": [QueuePE, Arn] }

  appointmentCL:
    handler: src/lambdas/appointment_cl.handler
    # EN VPC: necesita acceder a MySQL que está en VPC
    vpc:
      securityGroupIds:
        - { Ref: LambdaSecurityGroup }
      subnetIds:
        - subnet-0ad08093fa9607012 # us-east-1a
        - subnet-013a8a1adbe3f2b89 # us-east-1f
    events:
      - sqs:
          arn: { "Fn::GetAtt": [QueueCL, Arn] }

  netDiag:
    handler: src/lambdas/net_diag.handler
    timeout: 30
    # Sin VPC: solo para diagnóstico de red
    # Timeout en 30s (máximo permitido por HTTP API)
    events:
      - httpApi:
          method: GET
          path: /net-diag
resources:
  Resources:
    # --------- Networking (Security Groups) ----------
    # SG exclusivo para Lambdas (egress abierto)
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for Lambda functions to access RDS
        VpcId: vpc-02f4572d49646cc58
        SecurityGroupIngress: [] # Lambdas no requieren inbound
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0
        Tags:
          - Key: Name
            Value: rimac-lambda-sg

    # Permite que el RDS (SG existente) reciba 3306 desde el SG de Lambda
    AllowLambdaToRDSIngress:
      Type: AWS::EC2::SecurityGroupIngress
      Properties:
        GroupId: sg-0d49ca64324b0d9ac # SG del RDS (existente en tu cuenta)
        IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        SourceSecurityGroupId: { Ref: LambdaSecurityGroup }

      # SG para el Endpoint de Secrets Manager (permite 443 desde la Lambda)

    SecretsManagerEndpointSG:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: SG for Secrets Manager VPC Endpoint
        VpcId: vpc-02f4572d49646cc58
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourceSecurityGroupId: { Ref: LambdaSecurityGroup }
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0
        Tags:
          - Key: Name
            Value: rimac-sm-endpoint-sg

    # Interface Endpoint para Secrets Manager (en las MISMAS subnets de la Lambda)
    SecretsManagerEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: vpc-02f4572d49646cc58
        ServiceName: com.amazonaws.us-east-1.secretsmanager
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - subnet-0ad08093fa9607012 # 1a
          - subnet-013a8a1adbe3f2b89 # 1f
        SecurityGroupIds:
          - { Ref: SecretsManagerEndpointSG }
        # Política abierta (ajústala si quieres limitar)
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal: "*"
              Action: "secretsmanager:*"
              Resource: "*"

    # ------------------- DynamoDB --------------------
    AppointmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NAME}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: appointmentId
            AttributeType: S
          - AttributeName: insuredId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: appointmentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: insuredId-createdAt-index
            KeySchema:
              - AttributeName: insuredId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # -------------------- SNS ------------------------
    AppointmentsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-topic-${self:provider.stage}

    # --------------------- SQS -----------------------
    QueuePE:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-sqs-pe-${self:provider.stage}

    QueueCL:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-sqs-cl-${self:provider.stage}

    QueueConfirmed:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-sqs-confirmed-${self:provider.stage}

    # SNS → SQS subscriptions (filtros por país)
    TopicSubscriptionPE:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: AppointmentsTopic }
        Protocol: sqs
        Endpoint: { "Fn::GetAtt": [QueuePE, Arn] }
        FilterPolicy:
          countryISO: ["PE"]

    TopicSubscriptionCL:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: AppointmentsTopic }
        Protocol: sqs
        Endpoint: { "Fn::GetAtt": [QueueCL, Arn] }
        FilterPolicy:
          countryISO: ["CL"]

    # Permisos para que SNS envíe a SQS
    AllowSNSToSendToSQSPE:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [{ Ref: QueuePE }]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: Allow-SNS-PE
              Effect: Allow
              Principal: "*"
              Action: sqs:SendMessage
              Resource: { "Fn::GetAtt": [QueuePE, Arn] }
              Condition:
                ArnEquals:
                  aws:SourceArn: { Ref: AppointmentsTopic }

    AllowSNSToSendToSQSCL:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [{ Ref: QueueCL }]
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: Allow-SNS-CL
              Effect: Allow
              Principal: "*"
              Action: sqs:SendMessage
              Resource: { "Fn::GetAtt": [QueueCL, Arn] }
              Condition:
                ArnEquals:
                  aws:SourceArn: { Ref: AppointmentsTopic }

    # ---------------- EventBridge --------------------
    EventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:provider.environment.EVENT_BUS_NAME}

    # Regla: eventos de confirmación → QueueConfirmed
    EventToConfirmedQueueRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: ${self:provider.environment.EVENT_BUS_NAME}
        EventPattern:
          source: ["rimac.appointments"]
          detail-type: ["AppointmentConfirmed"]
        Targets:
          - Arn: { "Fn::GetAtt": [QueueConfirmed, Arn] }
            Id: SendToConfirmedQueue

    # Permiso para que EventBridge publique en QueueConfirmed
    AllowEventBridgeToSendToSQSConfirmed:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - { Ref: QueueConfirmed }
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: Allow-EventBridge-Confirmed
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: { "Fn::GetAtt": [QueueConfirmed, Arn] }
              Condition:
                StringLike:
                  # Usa el ARN completo de la regla incluyendo el EventBus y wildcard para el hash
                  aws:SourceArn:
                    Fn::Join:
                      - ""
                      - - "arn:aws:events:"
                        - ${self:provider.region}
                        - ":"
                        - ${aws:accountId}
                        - ":rule/"
                        - ${self:provider.environment.EVENT_BUS_NAME}
                        - "/"
                        - ${self:service}-${self:provider.stage}-EventToConfirmedQueueRule
                        - "*" # Wildcard para el hash que CloudFormation agrega

  Outputs:
    LambdaSecurityGroupId:
      Value: { Ref: LambdaSecurityGroup }
    TopicArn:
      Value: { Ref: AppointmentsTopic }
    QueuePEArn:
      Value: { "Fn::GetAtt": [QueuePE, Arn] }
    QueueCLArn:
      Value: { "Fn::GetAtt": [QueueCL, Arn] }
    QueueConfirmedArn:
      Value: { "Fn::GetAtt": [QueueConfirmed, Arn] }
